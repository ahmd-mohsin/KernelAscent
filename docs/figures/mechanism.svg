<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 300' width='100%' role='img' style='display:block;margin:auto;overflow:visible'><defs><marker id='a' markerWidth='9' markerHeight='9' refX='7' refY='3' orient='auto'><path d='M0,0 L7,3 L0,6 Z' fill='#111111'/></marker></defs><text x='24' y='28' font-family='Lora, Georgia, "Times New Roman", serif' font-size='16' font-weight='700' fill='#111111'>The improvement loop &amp; the causal contrast</text><rect x='40' y='70' width='180' height='60' rx='8' stroke='#111111' stroke-width='1.4' fill='none'/><text x='130' y='94' text-anchor='middle' font-family='Lora, Georgia, "Times New Roman", serif' font-size='15' font-weight='700' fill='#111111'>develop(U)</text><text x='130' y='113' text-anchor='middle' font-family='Lora, Georgia, "Times New Roman", serif' font-size='11.5' fill='#8a8a8a'>run procedure U under budget → Q</text><rect x='300' y='70' width='200' height='60' rx='8' stroke='#111111' stroke-width='1.4' fill='none'/><text x='400' y='94' text-anchor='middle' font-family='Lora, Georgia, "Times New Roman", serif' font-size='15' font-weight='700' fill='#111111'>revise(actor, target)</text><text x='400' y='113' text-anchor='middle' font-family='Lora, Georgia, "Times New Roman", serif' font-size='11.5' fill='#8a8a8a'>actor edits a COPY of target → child</text><rect x='600' y='70' width='220' height='60' rx='8' stroke='#111111' stroke-width='1.4' fill='none'/><text x='710' y='94' text-anchor='middle' font-family='Lora, Georgia, "Times New Roman", serif' font-size='15' font-weight='700' fill='#111111'>common-target fork</text><text x='710' y='113' text-anchor='middle' font-family='Lora, Georgia, "Times New Roman", serif' font-size='11.5' fill='#8a8a8a'>U₁ and U₀ edit the SAME target</text><line x1='220' y1='100' x2='300' y2='100' stroke='#111111' stroke-width='1.4' marker-end='url(#a)'/><line x1='500' y1='100' x2='600' y2='100' stroke='#111111' stroke-width='1.4' marker-end='url(#a)'/><rect x='560' y='190' width='130' height='54' rx='8' stroke='#111111' stroke-width='1.4' fill='none' stroke-dasharray='5 4'/><text x='625' y='214' text-anchor='middle' font-family='Lora, Georgia, "Times New Roman", serif' font-size='15' font-weight='700' fill='#111111'>U₂ = revise(U₁, T)</text><text x='625' y='233' text-anchor='middle' font-family='Lora, Georgia, "Times New Roman", serif' font-size='11.5' fill='#8a8a8a'>newer producer</text><rect x='710' y='190' width='130' height='54' rx='8' stroke='#111111' stroke-width='1.4' fill='none' stroke-dasharray='5 4'/><text x='775' y='214' text-anchor='middle' font-family='Lora, Georgia, "Times New Roman", serif' font-size='15' font-weight='700' fill='#111111'>V₂ = revise(U₀, T)</text><text x='775' y='233' text-anchor='middle' font-family='Lora, Georgia, "Times New Roman", serif' font-size='11.5' fill='#8a8a8a'>older producer</text><line x1='660' y1='130' x2='625' y2='190' stroke='#111111' stroke-width='1.4' marker-end='url(#a)'/><line x1='760' y1='130' x2='775' y2='190' stroke='#111111' stroke-width='1.4' marker-end='url(#a)'/><text x='700' y='280' text-anchor='middle' font-family='Lora, Georgia, "Times New Roman", serif' font-size='13' font-weight='700' fill='#111111'>F = Q(U₂) − Q(V₂)  (does the newer producer build a better child?)</text><text x='40' y='170' font-family='Lora, Georgia, "Times New Roman", serif' font-size='12.5' fill='#8a8a8a'>N = Q(child) − Q(target): does the child beat keeping the target?</text><text x='40' y='190' font-family='Lora, Georgia, "Times New Roman", serif' font-size='12.5' fill='#8a8a8a'>q₁−q₀: first-order improvement from one self-revision.</text></svg>