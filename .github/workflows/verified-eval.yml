name: Verified held-out eval (maintainer)

# GATED tier. Manually dispatched by a maintainer only. Runs a submitted model on the
# PRIVATE held-out split on the self-hosted Greenland cluster runner, then marks the row
# verified. Never triggered by external PRs.
#
# SECURITY MANDATE (Astra P0 — treat recipe execution as hostile code execution):
#   * Run on an EPHEMERAL, ISOLATED worker: no long-lived secrets, no unrestricted network
#     egress, no persistent writable shared cache, hard CPU/GPU/mem/time limits.
#   * The private evaluator OWNS the held-out inputs + scoring. NEVER hand the held-out
#     split to submitter/recipe code — the recipe runs on the fixed open trainee only; the
#     evaluator scores its output. Held-out data must not be readable by the recipe process.
#   * Never run PR-controlled code in this privileged workflow: a maintainer checks out the
#     specific reviewed submission commit; recipe repos are pinned by sha and sandboxed.
#   * Meter training AND search (incl. any teacher/API assistance) against the declared
#     repro.budget; run matched reset + search-only controls before ranking a gain.
on:
  workflow_dispatch:
    inputs:
      submission:
        description: "Path to the submission JSON (e.g. submissions/capability/my-model.json)"
        required: true
      gpu:
        description: "GPU index on the runner"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  verify:
    # requires a self-hosted runner labelled `greenland` with the held-out split + creds.
    runs-on: [self-hosted, greenland]
    steps:
      - uses: actions/checkout@v4
      - name: Run held-out eval + write verified metrics
        env:
          KA_DATA_DIR: ${{ secrets.KA_DATA_DIR }}
        run: |
          python3 scripts/run_submission.py "${{ inputs.submission }}" --gpu "${{ inputs.gpu }}"
      - name: Rebuild board + commit
        run: |
          python3 scripts/aggregate_leaderboard.py
          python3 scripts/pretty_names.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.submission }}" docs/data/leaderboard_community.json
          git commit -m "verify(bot): held-out eval for ${{ inputs.submission }} [skip ci]" || echo "nothing to commit"
          git push || true
