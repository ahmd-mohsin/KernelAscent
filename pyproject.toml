[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelascent"
version = "0.1.0"
description = "KernelAscent: a benchmark for recursive self-improvement via GPU kernel optimization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ahmed Mohsin" }]
keywords = ["gpu-kernels", "triton", "benchmark", "recursive-self-improvement", "llm", "ai-r-and-d"]
dependencies = [
  "boto3>=1.34",          # Bedrock backend (API models)
]

[project.optional-dependencies]
# Grading (and local open-weight generation) needs a GPU + PyTorch/Triton.
grade = ["torch>=2.4", "triton>=3.0"]
hf = ["transformers>=4.47,<5", "accelerate", "huggingface_hub"]

[project.scripts]
kernelascent = "kernelascent.cli:main"

[tool.setuptools]
packages = ["kernelascent"]

[tool.setuptools.package-data]
kernelascent = ["eval_models_valid.json"]
